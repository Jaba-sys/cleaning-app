<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Клининговая система</title>
<style>
  :root{
    --green:#1fa774;
    --green-dark:#158058;
    --blue:#1c6fd6;
    --blue-dark:#154f9c;
    --bg:#eef6f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(135deg, var(--bg) 0%, #e6f0fb 100%);
  }
  .card{
    background:#fff;
    padding:36px 32px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(28,111,214,0.15);
    width:100%;
    max-width:360px;
    text-align:center;
  }
  .card h1{
    font-size:22px;
    color:var(--blue-dark);
    margin-bottom:6px;
  }
  .card p{
    color:#666;
    font-size:14px;
    margin-top:0;
    margin-bottom:22px;
  }
  input[type=password]{
    width:100%;
    padding:12px 14px;
    border:2px solid #dce8e3;
    border-radius:10px;
    font-size:16px;
    outline:none;
    transition:.2s;
  }
  input[type=password]:focus{
    border-color:var(--green);
  }
  button{
    margin-top:16px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg, var(--green), var(--blue));
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  button:hover{filter:brightness(1.08);}
  .err{
    color:#d64545;
    font-size:13px;
    height:18px;
    margin-top:10px;
  }
  .lock{
    font-size:34px;
    margin-bottom:8px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1>Клининговая система</h1>
    <p>Введите пароль для входа</p>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="pwd" placeholder="Пароль" required>
      <button type="submit">Войти</button>
      <div class="err" id="err"></div>
    </form>
  </div>

<script>
  // В коде хранятся только SHA-256 хеши паролей, а не сами пароли.
  // Это не позволяет увидеть пароль, просто открыв исходный код страницы.
  const ADMIN_HASH  = "2ab477ccd3a276acf23b444fcd802b9227e83becbecda19b0b4d487a54498ad3"; // 18072014
  const WORKER_HASH = "79f06f8fde333461739f220090a23cb2a79f6d714bee100d0e4b4af249294619"; // 4444

  async function sha256(text){
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("err");
    errEl.textContent = "";
    const pwd = document.getElementById("pwd").value;
    const hash = await sha256(pwd);

    if (hash === ADMIN_HASH){
      // одноразовый токен сессии — хранится только в этой вкладке
      const token = crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random();
      sessionStorage.setItem("role", "admin");
      sessionStorage.setItem("token", token);
      window.location.href = "admin.html";
    } else if (hash === WORKER_HASH){
      const token = crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random();
      sessionStorage.setItem("role", "worker");
      sessionStorage.setItem("token", token);
      window.location.href = "worker.html";
    } else {
      errEl.textContent = "Неверный пароль";
      document.getElementById("pwd").value = "";
    }
  });
</script>
</body>
</html>
