<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaning Tasks</title>
<style>
  :root{
    --green:#1fa774;
    --green-dark:#158058;
    --blue:#1c6fd6;
    --blue-dark:#154f9c;
    --bg:#eef6f2;
    --card:#ffffff;
    --pending:#e8a93a;
    --progress:#1c6fd6;
    --done:#1fa774;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(135deg, var(--bg) 0%, #e6f0fb 100%);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(90deg, var(--green-dark), var(--blue-dark));
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  header h1{ margin:0; font-size:20px; }
  header .sub{ font-size:13px; opacity:.85; }
  .logout{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
  }
  .logout:hover{ background:rgba(255,255,255,.25); }

  .wrap{
    max-width:640px;
    margin:24px auto;
    padding:0 16px;
  }
  .task{
    background:var(--card);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    border-left:6px solid var(--pending);
  }
  .task.status-progress{ border-left-color: var(--progress); }
  .task.status-done{ border-left-color: var(--done); opacity:.65; }
  .task-info b{ font-size:18px; color:#222; }
  .task-info div{ font-size:14px; color:#666; margin-top:6px; }
  .badge{
    display:inline-block;
    margin-top:8px;
    padding:4px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    color:#fff;
    background:var(--pending);
  }
  .status-progress .badge{ background:var(--progress); }
  .status-done .badge{ background:var(--done); }
  .task-actions{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .btn{
    border:none;
    border-radius:9px;
    padding:10px 16px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    color:#fff;
  }
  .btn-start{ background:var(--blue); }
  .btn-start:hover{ filter:brightness(1.08); }
  .btn-done{ background:var(--green); }
  .btn-done:hover{ filter:brightness(1.08); }
  .btn-cancel{ background:#d64545; }
  .btn-cancel:hover{ filter:brightness(1.08); }
  .empty{
    text-align:center;
    color:#888;
    padding:40px 0;
    font-size:15px;
  }
  .section-title{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:#888;
    margin:22px 0 10px;
    font-weight:700;
  }
  .section-title:first-child{ margin-top:0; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🧹 Cleaning Tasks</h1>
    <div class="sub">Housekeeping</div>
  </div>
  <button class="logout" id="logoutBtn">Log out</button>
</header>

<div class="wrap">
  <div id="taskList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // --- block direct access without login ---
  if (sessionStorage.getItem("role") !== "worker" || !sessionStorage.getItem("token")) {
    window.location.href = "index.html";
  }

  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.clear();
    window.location.href = "index.html";
  });

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const tasksRef = db.ref("tasks");
  let currentTasks = [];

  // hash of the cancel password (4444), so it's not visible in the page source
  const CANCEL_HASH = "79f06f8fde333461739f220090a23cb2a79f6d714bee100d0e4b4af249294619";

  async function sha256(text){
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  function statusLabel(t){
    if (t.status === "done") return "Done";
    if (t.status === "progress") return "In progress";
    return t.time ? ("Scheduled for " + t.time) : "Pending";
  }

  function taskCard(t, actionsHtml){
    return `
      <div class="task status-${t.status}">
        <div class="task-info">
          <b>Room ${t.room}</b>
          <div>${t.task}${t.time ? " • " + t.time : ""}</div>
          <span class="badge">${statusLabel(t)}</span>
        </div>
        <div class="task-actions">${actionsHtml}</div>
      </div>
    `;
  }

  function renderTasks(){
    const active = currentTasks
      .filter(t => t.status !== "done")
      .sort((a,b)=>a.createdAt-b.createdAt);
    const done = currentTasks
      .filter(t => t.status === "done")
      .sort((a,b)=>b.createdAt-a.createdAt);

    const list = document.getElementById("taskList");
    let html = "";

    html += '<div class="section-title">To clean</div>';
    if (active.length === 0){
      html += '<div class="empty">No cleaning tasks right now 🎉</div>';
    } else {
      active.forEach(t => {
        const actions = `
          ${t.status !== "progress" ? `<button class="btn btn-start" data-action="start" data-id="${t.id}">Start</button>` : ""}
          <button class="btn btn-done" data-action="done" data-id="${t.id}">Done</button>
        `;
        html += taskCard(t, actions);
      });
    }

    if (done.length > 0){
      html += '<div class="section-title">Completed</div>';
      done.forEach(t => {
        const actions = `<button class="btn btn-cancel" data-action="cancel" data-id="${t.id}">Cancel</button>`;
        html += taskCard(t, actions);
      });
    }

    list.innerHTML = html;

    list.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;

        if (action === "start"){
          tasksRef.child(id).update({status:"progress"});
        }

        if (action === "done"){
          tasksRef.child(id).update({status:"done"});
        }

        if (action === "cancel"){
          const pwd = prompt("Enter the password to cancel this task:");
          if (pwd === null) return;
          const hash = await sha256(pwd);
          if (hash === CANCEL_HASH){
            tasksRef.child(id).update({status:"pending"});
          } else {
            alert("Wrong password.");
          }
        }
      });
    });
  }

  // realtime subscription: auto-updates on every device
  tasksRef.on("value", (snapshot) => {
    const tasks = [];
    snapshot.forEach((child) => {
      tasks.push({ id: child.key, ...child.val() });
    });
    currentTasks = tasks;
    renderTasks();
  });
</script>
</body>
</html>
